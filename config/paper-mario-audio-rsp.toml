# Paper Mario US 1.0 n_aspMain audio microcode.
#
# The task's rspboot loads this 0xC60-byte program into IMEM at 0x1080, not
# 0x1000. Keeping the real load address is essential: absolute jumps and the
# command-dispatch table contain RSP PCs in the 0x1080-based address space.
text_offset = 0x4E5A0
text_size = 0xC60
text_address = 0x04001080
rom_file_path = "../generated/rom/baserom.z64"
output_file_path = "../generated/aot/rsp/n_aspMain.cpp"
output_function_name = "n_aspMain"

# Big-endian halfwords from n_aspMainData[0x00..0x1F]. The runtime loads that
# data into DMEM before executing the generated function; these are the dynamic
# handler PCs reached by its `jr` command dispatcher. 0x02B0 normalizes to
# 0x12B0 under the RSP's 4 KiB IMEM address mask.
extra_indirect_branch_targets = [
    0x10EC, 0x139C, 0x119C, 0x1A64, 0x11C8, 0x17EC, 0x1208, 0x127C,
    0x1348, 0x1248, 0x1C84, 0x12D4, 0x12B0, 0x1384
]
